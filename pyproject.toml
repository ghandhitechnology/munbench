[project]
name = "munbench"
version = "0.1.0"
description = "MunBench (문벤치) — Korean creative-writing, EQ, and nuance benchmark for LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.scripts]
munbench = "munbench.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["munbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
