# MunBench harness configuration (example).
# Copy/edit as needed. All API keys are read from environment variables by
# litellm's provider convention (OPENAI_API_KEY, GEMINI_API_KEY,
# ANTHROPIC_API_KEY, etc.) — never put keys in this file.
#
# Single-key setup: prefix every model id with "openrouter/" and set only
# OPENROUTER_API_KEY. Model ids follow openrouter.ai/models naming
# (e.g. openrouter/openai/gpt-5, openrouter/google/gemini-2.5-pro).
#
# Subscription-based setup (no API key billing): prefix a model id with
# "claude-cli/" or "codex-cli/" to route it through the official Claude Code /
# Codex CLI in headless mode, billed against your ChatGPT/Claude *subscription*
# plan instead of a metered API key. Works for entries in both `models` and
# `judges`, and can be mixed freely with openrouter/-prefixed (or any other
# litellm) model ids in the same list, e.g.:
#   models:
#     - claude-cli/claude-opus-4-6     # runs `claude -p` — needs `claude login`
#     - codex-cli/gpt-5.6-sol          # runs `codex exec` — needs `codex login`
#     - openrouter/google/gemini-3.6-flash
# Caveats: your plan's rate limits apply (kept gentler via `cli_concurrency`
# below), and `temperature`/`max_tokens` are NOT controllable through either
# CLI — product defaults apply regardless of the values set below. See README
# ("Running on subscriptions instead of API keys") for setup steps.

# litellm model ids for the models under test (i.e. the models being benchmarked).
models:
  - openrouter/openai/gpt-5.6-sol      # flagship tier of the GPT-5.6 series
  - openrouter/google/gemini-3.6-flash
  - openrouter/anthropic/claude-opus-4.6
  # Anchor-only entries (must be generated to serve as Elo reference points):
  - openrouter/upstage/solar-pro-3     # Korean-focused mid anchor
  - openrouter/openai/gpt-5.6-luna     # light-tier floor anchor

# Ensemble of judges (cross-family, to dilute self/family bias). Kept
# separate from `models` even if there's overlap.
judges:
  - openrouter/openai/gpt-5.6-sol
  - openrouter/google/gemini-3.6-flash
  - openrouter/anthropic/claude-opus-4.6

# Each judge scores each sample this many times; report mean/std for
# repeatability (see DESIGN.md "Report repeatability").
rubric_iterations: 3

pairwise:
  enabled: true
  truncate_chars: 4000
  # Anchor models are pinned to a fixed Elo rating (see elo.py) and every
  # tested model is compared against every anchor.
  # Anchors must be in `models` (their generations are what anchors compare
  # against). Pinned at Elo 1200; chosen as a top/mid/floor ladder so every
  # tested model's rating is bracketed by fixed reference points.
  anchors:
    - openrouter/anthropic/claude-opus-4.6  # ceiling
    - openrouter/upstage/solar-pro-3        # Korean-native mid reference
    - openrouter/openai/gpt-5.6-luna        # floor
  # Round-robin comparisons among tested models are capped so pairwise
  # judging cost doesn't blow up as more models are added.
  max_comparisons_per_model: 40

temperature: 1.0
max_tokens: 2048

# Bounded concurrency for async generation/judging calls.
concurrency: 8
# Separate, lower concurrency cap for claude-cli/ and codex-cli/ models only —
# subscription CLI sessions are heavier than a plain API call and subscription
# rate limits are tighter than API rate limits.
cli_concurrency: 2
max_retries: 3
retry_backoff_seconds: 2.0

paths:
  data_dir: data
  results_dir: results
