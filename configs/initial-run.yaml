# MunBench initial run (2026-07-24) — budget-constrained subset run.
# ~60 records/model over a stratified 47-item subset (data_sample/), single
# rubric iteration, capped pairwise. "@high"/"@max" = OpenRouter reasoning
# effort (max maps to high). See examples/initial-run.md for results + caveats.

models:
  - openrouter/anthropic/claude-fable-5@high
  - openrouter/openai/gpt-5.6-sol@high
  - openrouter/x-ai/grok-4.5@high
  - openrouter/anthropic/claude-opus-4.8@high
  - openrouter/anthropic/claude-sonnet-5@high
  - openrouter/openai/gpt-5.6-terra@high
  - openrouter/moonshotai/kimi-k3@max
  - openrouter/z-ai/glm-5.2@max
  - openrouter/google/gemini-3.6-flash@high
  - openrouter/minimax/minimax-m3
  - openrouter/deepseek/deepseek-v4-pro@high
  # Korean flagship + anchors (only Korean flagship available on OpenRouter):
  - openrouter/upstage/solar-pro-3
  - openrouter/openai/gpt-5.6-luna

# Rubric judges: Opus 4.6 free via Claude membership; the other two via API.
judges:
  - claude-cli/claude-opus-4-6
  - openrouter/google/gemini-3.6-flash
  - openrouter/openai/gpt-5.6-luna

rubric_iterations: 1   # budget: single pass per judge for the initial run

pairwise:
  enabled: true
  truncate_chars: 4000
  anchors:
    - openrouter/anthropic/claude-opus-4.8@high   # ceiling
    - openrouter/upstage/solar-pro-3              # Korean-native mid reference
    - openrouter/openai/gpt-5.6-luna              # floor
  max_comparisons_per_model: 8
  max_anchor_items: 8
  # API-only judges for pairwise: keeps the membership CLI free for the
  # (heavier, higher-value) rubric pass.
  judges:
    - openrouter/google/gemini-3.6-flash
    - openrouter/openai/gpt-5.6-luna

temperature: 1.0
max_tokens: 3500
concurrency: 8
cli_concurrency: 2
max_retries: 3
retry_backoff_seconds: 2.0

paths:
  data_dir: data_sample
  results_dir: results/initial-run
